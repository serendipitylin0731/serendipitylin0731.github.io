<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 565">
  <title>Education and competition awards timeline</title>
  <desc>Education spans: Wenling Chengdong Primary School, 2013.09–2019.06; Taizhou Jiaojiang Beishu School, 2019.09–2022.06; Taizhou Sunson Middle School, 2022.09–2025.06; Zhiyuan College at Shanghai Jiao Tong University, 2025.09–present. Awards: National High School Math Olympiad third prize, 2023.09; Taizhou mathematics, physics and informatics first prizes and chemistry second prize, 2024.03; National High School Physics Competition third prize, 2024.09; National College Math Competition third prize, 2025.11; China Association for Educational Technology “AI+Education” Innovative Application Skills Competition second prize, 2026.10; China Telecom Xingchen Cup College AI Operator Development Challenge first prize, 2026.11.</desc>
