<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Beginner computing guides</title>
  <desc id="desc">Three illustrated guide cards for Markdown, Git, and WSL.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1425"/><stop offset="1" stop-color="#20213b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2bc65"/><stop offset="1" stop-color="#5de4c7"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f2bc65" stop-opacity=".17"/><stop offset="1" stop-color="#f2bc65" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0c1425" flood-opacity=".36"/></filter>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#bg)"/>
  <rect width="600" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="494" cy="75" r="196" fill="url(#glow)"/>
  <path d="M25 0H575" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="53" y="53" fill="#9caec8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">START HERE / TOOLKIT</text>
  <path d="M436 48H545" stroke="#4b607c" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="53" y="87" width="155" height="216" rx="17" fill="#152238" stroke="#4b607c" stroke-width="1.3"/>
    <rect x="222" y="72" width="155" height="231" rx="17" fill="#152238" stroke="#4b607c" stroke-width="1.3"/>
    <rect x="391" y="87" width="155" height="216" rx="17" fill="#152238" stroke="#4b607c" stroke-width="1.3"/>
  </g>
  <path d="M70 91h121M239 76h121M408 91h121" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <text x="76" y="121" fill="#9caec8" font-family="monospace" font-size="10">01 / WRITE</text>
  <text x="245" y="106" fill="#9caec8" font-family="monospace" font-size="10">02 / VERSION</text>
  <text x="414" y="121" fill="#9caec8" font-family="monospace" font-size="10">03 / BUILD</text>
  <rect x="76" y="143" width="109" height="93" rx="12" fill="#1b2c45"/>
  <text x="130" y="213" text-anchor="middle" fill="#f2bc65" font-family="monospace" font-size="65" font-weight="700">#</text>
  <rect x="76" y="247" width="75" height="5" rx="2.5" fill="#4b607c" opacity=".7"/>
  <text x="76" y="278" fill="#eff5ff" font-family="monospace" font-size="15" font-weight="700">Markdown</text>
  <rect x="245" y="128" width="109" height="108" rx="12" fill="#1b2c45"/>
  <path d="M276 155v49c0 11 10 18 22 18h20M276 177c0 11 10 18 22 18h20" fill="none" stroke="#5de4c7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="276" cy="155" r="7" fill="#1b2c45" stroke="#5de4c7" stroke-width="4"/>
  <circle cx="318" cy="195" r="7" fill="#1b2c45" stroke="#5de4c7" stroke-width="4"/>
  <circle cx="318" cy="222" r="7" fill="#1b2c45" stroke="#5de4c7" stroke-width="4"/>
  <rect x="245" y="247" width="83" height="5" rx="2.5" fill="#4b607c" opacity=".7"/>
  <text x="245" y="278" fill="#eff5ff" font-family="monospace" font-size="15" font-weight="700">Git</text>
  <rect x="414" y="143" width="109" height="93" rx="12" fill="#1b2c45"/>
  <rect x="427" y="157" width="83" height="63" rx="6" fill="#213550" stroke="#4b607c"/>
  <path d="M427 173h83" stroke="#4b607c"/>
  <circle cx="436" cy="165" r="2" fill="#f2bc65"/><circle cx="444" cy="165" r="2" fill="#5de4c7"/>
  <text x="440" y="202" fill="#5de4c7" font-family="monospace" font-size="25" font-weight="700">&gt;_</text>
  <rect x="414" y="247" width="70" height="5" rx="2.5" fill="#4b607c" opacity=".7"/>
  <text x="414" y="278" fill="#eff5ff" font-family="monospace" font-size="15" font-weight="700">WSL</text>
