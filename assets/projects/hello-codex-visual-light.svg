<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Hello Codex quota launcher</title>
  <desc id="desc">A five-hour quota status card beside daily schedule and manual send controls.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eaf5f6"/><stop offset="1" stop-color="#eae9f8"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#147e96"/><stop offset="1" stop-color="#7555b9"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#147e96" stop-opacity=".12"/><stop offset="1" stop-color="#147e96" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2e627c" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#eaf5f6" flood-opacity=".10"/></filter>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#bg)"/>
  <rect width="600" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="494" cy="75" r="196" fill="url(#glow)"/>
  <path d="M25 0H575" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)"><rect x="43" y="44" width="514" height="272" rx="21" fill="#ffffff" stroke="#b7ccd9"/></g>
  <path d="M43 96L557 96" fill="none" stroke="#b7ccd9" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <rect x="67" y="59" width="24" height="22" rx="6" fill="#e6f1f5"/>
  <text x="79" y="75" fill="#147e96" font-family="monospace" font-size="14" font-weight="800" text-anchor="middle">◈</text>
  <text x="104" y="75" fill="#1e344d" font-family="monospace" font-size="12" font-weight="800" letter-spacing="1">HELLO! CODEX</text>
  <path d="M474 72L527 72" fill="none" stroke="#b7ccd9" stroke-width="2" stroke-linecap="round"/>
  <circle cx="535" cy="72" r="4" fill="#147e96"/>
  <text x="75" y="121" fill="#60798f" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">QUOTA / FIVE-HOUR WINDOW</text>
<rect x="75" y="136" width="286" height="138" rx="8" fill="#f2f7fb" stroke="#b7ccd9"/>
<text x="93" y="161" fill="#60798f" font-family="monospace" font-size="10" font-weight="700">CODEX STATUS</text>
<text x="93" y="207" fill="#1e344d" font-family="monospace" font-size="38" font-weight="800">5h</text>
<text x="159" y="207" fill="#147e96" font-family="monospace" font-size="14" font-weight="800">WINDOW</text>
<rect x="93" y="223" width="250" height="9" rx="4" fill="#e6f1f5"/>
<rect x="93" y="223" width="157" height="9" rx="4" fill="#147e96"/>
<text x="93" y="258" fill="#60798f" font-family="monospace" font-size="10" font-weight="700">RESET / SCHEDULED</text>
<rect x="378" y="136" width="148" height="138" rx="8" fill="#f2f7fb" stroke="#b7ccd9"/>
<text x="395" y="160" fill="#60798f" font-family="monospace" font-size="10" font-weight="700">TODAY</text>
<rect x="395" y="178" width="114" height="14" rx="7" fill="#e6f1f5"/>
<rect x="395" y="178" width="68" height="14" rx="7" fill="#7555b9" opacity=".7"/>
<rect x="474" y="178" width="35" height="14" rx="7" fill="#147e96" opacity=".8"/>
<text x="395" y="212" fill="#60798f" font-family="monospace" font-size="9" font-weight="700">ACTIVE HOURS</text>
<rect x="395" y="226" width="114" height="29" rx="8" fill="#147e96" opacity=".18"/>
<text x="452" y="245" fill="#147e96" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">SEND NOW</text>
<text x="75" y="295" fill="#60798f" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">AUTO MONITOR  /  TRAY  /  MANUAL</text>
</svg>
