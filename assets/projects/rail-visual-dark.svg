      <circle cx="504" cy="170" r="3" fill="#a78bfa"/>
      <text x="504" y="148" text-anchor="middle" fill="#9caec8" font-family="monospace" font-size="11" font-weight="700">04</text>
  <path d="M70 285H530" stroke="#4b607c" stroke-opacity=".45" stroke-dasharray="5 7"/>
  <g fill="#9caec8" font-family="monospace" font-size="10" letter-spacing="1.1"><text x="72" y="302">PLAN</text><text x="283" y="302" text-anchor="middle">FILTER</text><text x="529" y="302" text-anchor="end">ARRIVE</text></g>
</svg>