<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Trajectory railway planner</title>
  <desc id="desc">A route map with four connected stations and a train symbol.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1425"/><stop offset="1" stop-color="#20213b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#59d4e7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#59d4e7" stop-opacity=".17"/><stop offset="1" stop-color="#59d4e7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0c1425" flood-opacity=".36"/></filter>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#bg)"/>
  <rect width="600" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="494" cy="75" r="196" fill="url(#glow)"/>
  <path d="M25 0H575" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)"><rect x="43" y="44" width="514" height="272" rx="21" fill="#152238" stroke="#4b607c" stroke-width="1.4"/></g>
  <path d="M43 96H557" stroke="#4b607c" stroke-opacity=".6"/>
  <rect x="68" y="61" width="30" height="22" rx="6" fill="#213550"/>
  <path d="M77 78V66h13v12M78 71h11" fill="none" stroke="#59d4e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="80" cy="80" r="1.4" fill="#59d4e7"/><circle cx="88" cy="80" r="1.4" fill="#59d4e7"/>
  <text x="109" y="77" fill="#eff5ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1.5">ROUTE / 01</text>
  <path d="M476 72h51" stroke="#4b607c" stroke-width="2" stroke-linecap="round"/>
  <circle cx="535" cy="72" r="4" fill="#59d4e7"/>
  <path d="M100 234C153 234 149 157 226 157S313 244 380 228 441 147 504 170" fill="none" stroke="#213550" stroke-width="22" stroke-linecap="round"/>
  <path d="M100 234C153 234 149 157 226 157S313 244 380 228 441 147 504 170" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="234" r="11" fill="#152238" stroke="#59d4e7" stroke-width="4"/>
      <circle cx="100" cy="234" r="3" fill="#59d4e7"/>
      <text x="100" y="260" text-anchor="middle" fill="#9caec8" font-family="monospace" font-size="11" font-weight="700">01</text><circle cx="226" cy="157" r="11" fill="#152238" stroke="#87cfd6" stroke-width="4"/>
      <circle cx="226" cy="157" r="3" fill="#87cfd6"/>
      <text x="226" y="135" text-anchor="middle" fill="#9caec8" font-family="monospace" font-size="11" font-weight="700">02</text><circle cx="380" cy="228" r="11" fill="#152238" stroke="#a78bfa" stroke-width="4"/>
      <circle cx="380" cy="228" r="3" fill="#a78bfa"/>
