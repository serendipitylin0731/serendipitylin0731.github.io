<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Teacher attendance and payroll</title>
  <desc id="desc">Validated attendance rows beside a payroll export card.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1425"/><stop offset="1" stop-color="#20213b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5de4c7"/><stop offset="1" stop-color="#f2bc65"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#5de4c7" stop-opacity=".17"/><stop offset="1" stop-color="#5de4c7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0c1425" flood-opacity=".36"/></filter>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#bg)"/>
  <rect width="600" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="494" cy="75" r="196" fill="url(#glow)"/>
  <path d="M25 0H575" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)"><rect x="43" y="44" width="514" height="272" rx="21" fill="#152238" stroke="#4b607c"/></g>
  <path d="M43 96L557 96" fill="none" stroke="#4b607c" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <rect x="67" y="59" width="24" height="22" rx="6" fill="#213550"/>
  <text x="79" y="75" fill="#5de4c7" font-family="monospace" font-size="14" font-weight="800" text-anchor="middle">◈</text>
  <text x="104" y="75" fill="#eff5ff" font-family="monospace" font-size="12" font-weight="800" letter-spacing="1">ATTENDANCE / PAYROLL</text>
  <path d="M474 72L527 72" fill="none" stroke="#4b607c" stroke-width="2" stroke-linecap="round"/>
  <circle cx="535" cy="72" r="4" fill="#5de4c7"/>
  <text x="74" y="121" fill="#9caec8" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">ATTENDANCE / VALIDATION</text>
<rect x="74" y="137" width="287" height="139" rx="8" fill="#1b2c45" stroke="#4b607c"/>
<text x="90" y="159" fill="#9caec8" font-family="monospace" font-size="10" font-weight="700">CLASS</text>
<text x="237" y="159" fill="#9caec8" font-family="monospace" font-size="10" font-weight="700" text-anchor="end">SESSIONS</text>
<text x="340" y="159" fill="#5de4c7" font-family="monospace" font-size="10" font-weight="700" text-anchor="end">OK</text>
<path d="M90 170L344 170" fill="none" stroke="#4b607c" stroke-width="1" stroke-linecap="round" opacity=".55"/>
<text x="90" y="186" fill="#eff5ff" font-family="monospace" font-size="11" font-weight="700">A-01</text>
<text x="237" y="186" fill="#9caec8" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">16</text>
<text x="340" y="186" fill="#5de4c7" font-family="monospace" font-size="14" font-weight="800" text-anchor="end">✓</text>
<path d="M90 198L344 198" fill="none" stroke="#4b607c" stroke-width="1" stroke-linecap="round" opacity=".55"/>
<text x="90" y="214" fill="#eff5ff" font-family="monospace" font-size="11" font-weight="700">A-02</text>
<text x="237" y="214" fill="#9caec8" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">18</text>
<text x="340" y="214" fill="#5de4c7" font-family="monospace" font-size="14" font-weight="800" text-anchor="end">✓</text>
<path d="M90 226L344 226" fill="none" stroke="#4b607c" stroke-width="1" stroke-linecap="round" opacity=".55"/>
<text x="90" y="242" fill="#eff5ff" font-family="monospace" font-size="11" font-weight="700">A-03</text>
<text x="237" y="242" fill="#9caec8" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">17</text>
<text x="340" y="242" fill="#5de4c7" font-family="monospace" font-size="14" font-weight="800" text-anchor="end">✓</text>
<rect x="379" y="137" width="147" height="139" rx="8" fill="#1b2c45" stroke="#4b607c"/>
<text x="395" y="161" fill="#9caec8" font-family="monospace" font-size="10" font-weight="700">PAYROLL</text>
<text x="395" y="212" fill="#5de4c7" font-family="monospace" font-size="29" font-weight="800">Σ 51</text>
<text x="395" y="236" fill="#9caec8" font-family="monospace" font-size="10" font-weight="700">SESSIONS</text>
<rect x="395" y="247" width="115" height="17" rx="8" fill="#f2bc65" opacity=".18"/>
<text x="452" y="259" fill="#f2bc65" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">EXPORT XLSX</text>
<text x="75" y="294" fill="#9caec8" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">IMPORT  →  CHECK  →  EXPORT</text>
</svg>
