<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Beginner computing guides</title>
  <desc id="desc">Illustrated cards for Markdown, Git, and WSL beginner guides.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eaf5f6"/><stop offset="1" stop-color="#eae9f8"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a45e19"/><stop offset="1" stop-color="#167c74"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a45e19" stop-opacity=".12"/><stop offset="1" stop-color="#a45e19" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2e627c" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#eaf5f6" flood-opacity=".10"/></filter>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#bg)"/>
  <rect width="600" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="494" cy="75" r="196" fill="url(#glow)"/>
  <path d="M25 0H575" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)"><rect x="43" y="44" width="514" height="272" rx="21" fill="#ffffff" stroke="#b7ccd9"/></g>
  <path d="M43 96L557 96" fill="none" stroke="#b7ccd9" stroke-width="1" stroke-linecap="round" opacity=".6"/>
