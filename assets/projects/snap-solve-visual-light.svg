<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Snap Solve</title>
  <desc id="desc">A screen selection converted into Markdown and an answer.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eaf5f6"/><stop offset="1" stop-color="#eae9f8"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#167c74"/><stop offset="1" stop-color="#7555b9"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#167c74" stop-opacity=".12"/><stop offset="1" stop-color="#167c74" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2e627c" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#eaf5f6" flood-opacity=".10"/></filter>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#bg)"/>
  <rect width="600" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="494" cy="75" r="196" fill="url(#glow)"/>
  <path d="M25 0H575" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)"><rect x="43" y="44" width="514" height="272" rx="21" fill="#ffffff" stroke="#b7ccd9"/></g>
  <path d="M43 96L557 96" fill="none" stroke="#b7ccd9" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <rect x="67" y="59" width="24" height="22" rx="6" fill="#e6f1f5"/>
  <text x="79" y="75" fill="#167c74" font-family="monospace" font-size="14" font-weight="800" text-anchor="middle">◈</text>
  <text x="104" y="75" fill="#1e344d" font-family="monospace" font-size="12" font-weight="800" letter-spacing="1">SNAP SOLVE</text>
  <path d="M474 72L527 72" fill="none" stroke="#b7ccd9" stroke-width="2" stroke-linecap="round"/>
  <circle cx="535" cy="72" r="4" fill="#167c74"/>
  <text x="72" y="121" fill="#60798f" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">CAPTURE / TRANSCRIBE / SOLVE</text>
<rect x="72" y="138" width="204" height="129" rx="8" fill="#f2f7fb" stroke="#b7ccd9"/>
<text x="91" y="160" fill="#60798f" font-family="monospace" font-size="9" font-weight="700">SCREEN SELECTION</text>
<path d="M100 184v-9h15 M248 184v-9h-15 M100 224v9h15 M248 224v9h-15" fill="none" stroke="#167c74" stroke-width="3" stroke-linecap="round"/>
<text x="174" y="212" fill="#1e344d" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">x² + y² = ?</text>
<text x="296" y="211" fill="#167c74" font-family="monospace" font-size="23" font-weight="800" text-anchor="middle">→</text>
<rect x="317" y="138" width="211" height="129" rx="8" fill="#f2f7fb" stroke="#b7ccd9"/>
<text x="336" y="160" fill="#60798f" font-family="monospace" font-size="9" font-weight="700">MARKDOWN / ANSWER</text>
<rect x="336" y="176" width="79" height="6" rx="3" fill="#7555b9"/>
<rect x="336" y="194" width="165" height="5" rx="3" fill="#b7ccd9"/>
<rect x="336" y="210" width="148" height="5" rx="3" fill="#b7ccd9"/>
<rect x="336" y="226" width="127" height="5" rx="3" fill="#b7ccd9"/>
<rect x="336" y="242" width="74" height="13" rx="6" fill="#167c74" opacity=".2"/>
<text x="373" y="252" fill="#167c74" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">COPY</text>
<text x="72" y="294" fill="#60798f" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">SCREENSHOT  /  MARKDOWN  /  AI</text>
</svg>
