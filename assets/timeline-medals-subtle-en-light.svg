<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 565" role="img">
  <title>Education and competition awards timeline</title>
  <desc>Schools are shown as time spans: Wenling Chengdong Primary School, 2013.09–2019.06; Taizhou Jiaojiang Beishu School, 2019.09–2022.06; Taizhou Shusheng High School, 2022.09–2025.06; Zhiyuan College at Shanghai Jiao Tong University, 2025.09–present. Awards are shown as milestones: National High School Mathematics Olympiad third prize, 2023.09; Taizhou first prizes in mathematics, physics, and informatics and second prize in chemistry, 2024.03; National High School Physics Competition third prize, 2024.09; National College Mathematics Competition third prize, 2025.11.</desc>
