    <rect x="161" y="290" width="86" height="29" rx="14.5" fill="#292348" stroke="#9a83e9" stroke-opacity=".7"/>
    <text x="204" y="310" fill="#c5b8ff" text-anchor="middle">TOOLS</text>
    <rect x="257" y="290" width="82" height="29" rx="14.5" fill="#473225" stroke="#d1a166" stroke-opacity=".7"/>
    <text x="298" y="310" fill="#f2c487" text-anchor="middle">CODE</text>
