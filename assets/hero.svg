    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M24 0H1176" stroke="url(#rail)" stroke-width="5"/>
  <circle cx="1035" cy="65" r="125" fill="#a78bfa" opacity=".08" filter="url(#glow)"/>
  <circle cx="876" cy="297" r="130" fill="#5de4c7" opacity=".06" filter="url(#glow)"/>

  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, sans-serif">
