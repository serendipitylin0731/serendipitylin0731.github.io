    <text x="67" y="264" fill="#e2e7f5" font-size="19">插件与软件开发爱好者 · 上海交通大学</text>
  </g>

  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
